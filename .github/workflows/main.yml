name: ubuntu-server-ephemeral

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: tailscale-exit-node
  cancel-in-progress: true

jobs:
  ubuntu-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Tarik Repository (Checkout)
        uses: actions/checkout@v4

      - name: Setup Server Credentials & SSH
        run: |
          sudo useradd -m -s /bin/bash runneradmin
          echo "runneradmin:${{ secrets.RDP_PASS }}" | sudo chpasswd
          sudo usermod -aG sudo runneradmin
          sudo systemctl start ssh
          sudo systemctl enable ssh

      - name: Install Network Core (Tailscale, Cloudflared & CLI Utils)
        run: |
          # 1. Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="azure-workstation" --accept-routes
          
          # 2. Cloudflared (Linux Native)
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          sudo cloudflared service install ${{ secrets.CF_TUNNEL_TOKEN }}
          
          # 3. CLI Utils (jq krusial untuk bot Bash)
          sudo apt-get update -y
          sudo apt-get install -y speedtest-cli nmap jq curl tar unzip neofetch

      - name: Siapkan Script Auto-Setup
        run: |
          sudo cp setup.sh /root/setup.sh
          sudo chmod +x /root/setup.sh

      - name: Get Tailscale IP
        run: echo "TAILSCALE_IP=$(tailscale ip -4)" >> $GITHUB_ENV

      - name: Run AzureBot Core Engine (PURE BASH)
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          PTERO_DB_PASS: ${{ secrets.RDP_PASS }}
        run: |
          # Fungsi pengirim pesan Telegram yang bersih menggunakan jq
          send_msg() {
            local msg="$1"
            jq -n --arg cid "$CHAT_ID" --arg txt "$msg" '{chat_id: $cid, text: $txt, parse_mode: "HTML"}' | \
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" -H "Content-Type: application/json" -d @- > /dev/null
          }

          # Daftar Menu
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/setMyCommands" \
            -H "Content-Type: application/json" \
            -d '{"commands": [{"command": "help", "description": "Panduan AI & Bot"}, {"command": "status", "description": "Cek beban CPU/RAM"}, {"command": "ip", "description": "Akses SSH"}, {"command": "neofetch", "description": "Spek sistem"}, {"command": "setup", "description": "Install Ptero Suite"}, {"command": "scanhost", "description": "Nmap target IP"}, {"command": "kill", "description": "pkill proses Linux"}, {"command": "cmd", "description": "Jalankan bash"}]}' > /dev/null

          send_msg "[SYS] <b>UBUNTU SERVER ACTIVE! (PURE BASH ENGINE)</b> 🐧🚀"$'\n\n'"[KEY] <b>SSH:</b> <code>ssh runneradmin@$TAILSCALE_IP</code>"$'\n'"Pass: <code>$PTERO_DB_PASS</code>"

          OFFSET=0
          # Infinite Polling Loop
          while true; do
            UPDATES=$(curl -s "https://api.telegram.org/bot$BOT_TOKEN/getUpdates?offset=$OFFSET&timeout=30")
            
            # Parsing array JSON menggunakan jq dan base64 (Aman dari spasi)
            for ROW in $(echo "$UPDATES" | jq -r '.result[] | @base64' 2>/dev/null); do
              DECODED=$(echo "$ROW" | base64 --decode)
              
              UPDATE_ID=$(echo "$DECODED" | jq -r '.update_id')
              OFFSET=$((UPDATE_ID + 1))
              
              USER_ID=$(echo "$DECODED" | jq -r '.message.from.id')
              TEXT=$(echo "$DECODED" | jq -r '.message.text // empty')
              
              if [ "$USER_ID" != "$CHAT_ID" ] || [ -z "$TEXT" ]; then
                continue
              fi
              
              # Logika Command Native Bash
              if [[ "$TEXT" == /* ]]; then
                CMD=$(echo "$TEXT" | awk '{print $1}')
                ARGS=$(echo "$TEXT" | cut -s -d' ' -f2-)
                
                case "$CMD" in
                  /help|/start) send_msg "[INFO] <b>COMMAND CENTER (Bash Native)</b>" ;;
                  /ip) send_msg "[KEY] <b>SSH:</b> <code>ssh runneradmin@$TAILSCALE_IP</code>" ;;
                  /neofetch) 
                    OUT=$(neofetch --stdout)
                    send_msg "[SYS] <b>Neofetch:</b>"$'\n'"<pre>${OUT}</pre>" 
                    ;;
                  /status)
                    RAM_USED=$(free -m | awk '/Mem:/ {print $3}')
                    RAM_TOTAL=$(free -m | awk '/Mem:/ {print $2}')
                    CPU_VAL=$(top -bn1 | awk '/Cpu/ {print $2 + $4}')
                    UP=$(uptime -p)
                    send_msg "[STATS] <b>SERVER HEALTH</b>"$'\n'"- CPU: ${CPU_VAL}%"$'\n'"- RAM: ${RAM_USED} MB / ${RAM_TOTAL} MB"$'\n'"- Uptime: ${UP}"
                    ;;
                  /speedtest)
                    OUT=$(speedtest-cli --simple)
                    send_msg "[NET] <b>Speedtest:</b>"$'\n'"<pre>${OUT}</pre>"
                    ;;
                  /scanhost)
                    OUT=$(nmap -Pn -F "$ARGS" 2>&1)
                    send_msg "[SCAN] <b>Nmap Result:</b>"$'\n'"<pre>${OUT}</pre>"
                    ;;
                  /kill)
                    OUT=$(pkill -9 -f "$ARGS" && echo "Killed" || echo "Not Found")
                    send_msg "[KILL] <pre>${OUT}</pre>"
                    ;;
                  /setup)
                    send_msg "[SYS] Mengeksekusi <code>/root/setup.sh</code> di background..."
                    export SETUP_DB_PASS="$PTERO_DB_PASS"
                    nohup bash /root/setup.sh > /tmp/setup.log 2>&1 &
                    ;;
                  /cmd)
                    if [[ "$ARGS" == cd\ * ]]; then
                      DIR=$(echo "$ARGS" | sed 's/^cd //')
                      cd "$DIR" 2>/dev/null
                      send_msg "[BASH] 📁 Pindah ke: <code>$(pwd)</code>"
                    else
                      OUT=$(eval "$ARGS" 2>&1)
                      if [ -z "$OUT" ]; then OUT="(Sukses / Tidak ada output)"; fi
                      OUT=$(echo "$OUT" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
                      send_msg "[BASH] <b>Output:</b>"$'\n'"<pre>${OUT}</pre>"
                    fi
                    ;;
                esac
              else
                # Logika Groq API
                PAYLOAD=$(jq -n --arg text "$TEXT" '{model: "openai/gpt-oss-120b", messages: [{"role": "system", "content": "Kamu AzureBot, asisten server Ubuntu. Jawab singkat."}, {"role": "user", "content": $text}]}')
                RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" -H "Authorization: Bearer $GROQ_KEY" -H "Content-Type: application/json" -d "$PAYLOAD")
                AI_REPLY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "Error API"')
                AI_REPLY=$(echo "$AI_REPLY" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
                send_msg "$AI_REPLY"
              fi
            done
            sleep 1
          done

      - name: Tailscale Node Cleanup
        if: always()
        run: |
          echo "Memutuskan koneksi dan menghapus node dari Tailnet..."
          sudo tailscale logout || true
