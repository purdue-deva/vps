name: VPS-AutoPtero-v2.9

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: tailscale-exit-node
  cancel-in-progress: true

jobs:
  ubuntu-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Tarik Repository (Checkout)
        uses: actions/checkout@v4

      - name: Setup Server Credentials & SSH
        run: |
          sudo useradd -m -s /bin/bash parid
          echo "parid:${{ secrets.RDP_PASS }}" | sudo chpasswd
          sudo usermod -aG sudo parid
          sudo systemctl start ssh
          sudo systemctl enable ssh

      - name: Install Network Core (Tailscale, Cloudflared & CLI Utils)
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="azure-workstation" --accept-routes
          
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          
          sudo apt-get update -y
          sudo apt-get install -y speedtest-cli nmap jq curl tar unzip neofetch

      - name: Siapkan Script Auto-Setup
        run: |
          sudo cp setup.sh /root/setup.sh
          sudo chmod +x /root/setup.sh

      - name: Get Tailscale IP
        run: echo "TAILSCALE_IP=$(tailscale ip -4)" >> $GITHUB_ENV

      - name: Run AzureBot Core Engine
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          PTERO_DB_PASS: ${{ secrets.RDP_PASS }}
        run: |
          $botToken = $env:BOT_TOKEN; $allowedId = $env:CHAT_ID; $ipInfo = $env:TAILSCALE_IP
          $passInfo = "${{ secrets.RDP_PASS }}"; $groqKey = $env:GROQ_KEY

          function Send-Msg ($msg) {
              $payload = @{ chat_id = $allowedId; text = $msg; parse_mode = "HTML" } | ConvertTo-Json
              Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/sendMessage" -Method Post -ContentType "application/json" -Body $payload -ErrorAction SilentlyContinue | Out-Null
          }

          function Run-Bash ($cmd) {
              try { return (Invoke-Expression "sudo bash -c `"$cmd`" 2>&1" | Out-String).Trim() } catch { return "$_" }
          }

          $menu = @(
              @{command="help"; description="Panduan AI & Bot"}, @{command="status"; description="Cek beban CPU/RAM"},
              @{command="ip"; description="Akses SSH & Network"}, @{command="neofetch"; description="Tampilkan spek sistem"},
              @{command="setup"; description="Auto-install Ptero & Web Stack"}, @{command="scanhost"; description="Nmap target IP"},
              @{command="kill"; description="pkill proses Linux"}, @{command="expose"; description="Cloudflared tunnel port"},
              @{command="cmd"; description="Jalankan bash (Support cd)"}
          )
          Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/setMyCommands" -Method Post -ContentType "application/json" -Body (@{commands=$menu} | ConvertTo-Json -Depth 3) | Out-Null

          Send-Msg "[SYS] <b>UBUNTU SERVER ACTIVE!</b>`n`n[KEY] <b>SSH:</b> <code>ssh parid@$ipInfo</code>`nPass: <code>$passInfo</code>`n`nFile <code>setup.sh</code> telah di-checkout. Ketik /setup untuk eksekusi."

          $offset = 0
          while ($true) {
              try {
                  $updates = Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/getUpdates?offset=$offset&timeout=30" -TimeoutSec 35
                  foreach ($upd in $updates.result) {
                      $offset = $upd.update_id + 1
                      $text = $upd.message.text
                      if ([string]::IsNullOrWhiteSpace($text) -or $upd.message.from.id.ToString() -ne $allowedId) { continue }

                      if ($text.StartsWith("/")) {
                          switch -Regex ($text) {
                              "^/(start|help)" { Send-Msg "[INFO] <b>COMMAND CENTER</b>`nGunakan menu di pojok kiri bawah." }
                              "^/ip" { Send-Msg "[KEY] <b>SSH:</b>`n<code>ssh parid@$ipInfo</code>`nPass: <code>$passInfo</code>" }
                              "^/neofetch" { Send-Msg "[SYS] <b>Neofetch:</b>`n<pre>$(Run-Bash "neofetch --stdout")</pre>" }
                              "^/status" { 
                                  $ramUsed = Run-Bash "free -m | grep Mem | awk '{print `$3}'"
                                  $ramTotal = Run-Bash "free -m | grep Mem | awk '{print `$2}'"
                                  $cpuVal = Run-Bash "top -bn1 | grep 'Cpu(s)' | awk '{print `$2 + `$4}'"
                                  $up = Run-Bash "uptime -p"
                                  Send-Msg "[STATS] <b>SERVER HEALTH</b>`n- CPU: $cpuVal%`n- RAM: $ramUsed MB / $ramTotal MB`n- Uptime: $up"
                              }
                              "^/speedtest" { Send-Msg "[NET] <b>Speedtest:</b>`n<pre>$(Run-Bash "speedtest-cli --simple")</pre>" }
                              "^/scanhost (.+)" { Send-Msg "[SCAN] <b>Nmap Result:</b>`n<pre>$(Run-Bash "nmap -Pn -F $($matches[1])")</pre>" }
                              "^/kill (.+)" { Send-Msg "[KILL] <pre>$(Run-Bash "pkill -9 -f $($matches[1]) && echo 'Killed' || echo 'Not Found'")</pre>" }
                              "^/expose (\d+)" { 
                                  $port = $matches[1]
                                  Run-Bash "nohup cloudflared tunnel --url http://localhost:$port > /tmp/cf-$port.log 2>&1 &"
                                  Start-Sleep 5
                                  Send-Msg "[NET] Tunnel Port $port aktif:`n<code>$(Run-Bash "grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cf-$port.log | head -1")</code>" 
                              }
                              "^/setup" {
                                  Send-Msg "[SYS] Mengeksekusi <code>/root/setup.sh</code> di background.`nPass SSH telah di-inject sebagai kredensial DB Pterodactyl.`nCek progress: <code>/cmd tail -n 15 /tmp/setup.log</code>"
                                  Run-Bash "export SETUP_DB_PASS='$env:PTERO_DB_PASS'; nohup bash /root/setup.sh > /tmp/setup.log 2>&1 &" | Out-Null
                              }
                              "^/cmd (.+)" { 
                                  $cmdInput = $matches[1].Trim()
                                  if ($cmdInput.StartsWith("cd ")) {
                                      $targetDir = $cmdInput.Substring(3).Trim()
                                      try {
                                          Set-Location -Path $targetDir
                                          Send-Msg "[BASH] 📁 Lokasi sekarang:`n<code>$((Get-Location).Path)</code>"
                                      } catch { Send-Msg "[X] Direktori tidak valid." }
                                  } else {
                                      $out = Run-Bash $cmdInput
                                      if ([string]::IsNullOrWhiteSpace($out)) { $out = "(Sukses / Tidak ada output)" }
                                      Send-Msg "[BASH] <b>Output:</b>`n<pre>$out</pre>"
                                  }
                              }
                          }
                      } else {
                          $pld = @{ model="openai/gpt-oss-120b"; messages=@(@{role="system"; content="Kamu AzureBot, asisten server Ubuntu Tuan Farid Achmad. Jawab to-the-point dan teknis."}, @{role="user"; content=$text}) } | ConvertTo-Json -Depth 5
                          $res = Invoke-RestMethod -Uri "https://api.groq.com/openai/v1/chat/completions" -Method Post -Headers @{"Authorization"="Bearer $groqKey"; "Content-Type"="application/json"} -Body $pld -TimeoutSec 15
                          Send-Msg $res.choices[0].message.content.Replace('<', '&lt;').Replace('>', '&gt;')
                      }
                  }
              } catch { Start-Sleep 5 }
          }
